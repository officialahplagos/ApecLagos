<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f766e" />
    <title>APEC Lagos | Offline</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f4f8f6; color: #162b45; font-family: Arial, Helvetica, sans-serif; }
      main { width: min(100%, 440px); border-top: 4px solid #0f766e; background: #fff; padding: 32px; box-shadow: 0 18px 50px rgba(22, 43, 69, .12); }
      img { width: 64px; height: 64px; }
      h1 { margin: 24px 0 10px; font-family: Georgia, "Times New Roman", serif; font-size: 30px; }
      p { margin: 0 0 24px; color: #526663; line-height: 1.6; }
      button { min-height: 46px; border: 0; border-radius: 6px; padding: 0 18px; background: #0f766e; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.svg" alt="APEC Lagos" />
      <h1>You are offline</h1>
      <p>Reconnect to the internet to view current alerts, membership records, and safeguarding information.</p>
      <button type="button" onclick="location.reload()">Try Again</button>
    </main>
  </body>
</html>
